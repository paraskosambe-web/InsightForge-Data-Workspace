openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: InsightForge application API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Datasets
    description: User-owned datasets and data analysis.
  - name: Models
    description: Model training and experiment tracking.
  - name: Reports
    description: Generated analysis reports.
  - name: Analyst
    description: Tool-backed dataset questions.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [Auth]
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to the OIDC authorization endpoint. }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [Auth]
      summary: Complete the browser OIDC login flow
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: iss, in: query, required: false, schema: { type: string, format: uri } }
      responses:
        "302": { description: Redirect to the validated return path. }
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [Auth]
      summary: Clear the browser session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - { name: returnTo, in: query, required: false, schema: { type: string, default: "/" } }
      responses:
        "302": { description: Redirect to the OIDC logout endpoint. }
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [Auth]
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileTokenExchangeRequest" }
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileTokenExchangeSuccess" }
        "400":
          description: Invalid exchange request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Token claims were unusable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [Auth]
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutSuccess" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a private object upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Signed upload URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400":
          description: Invalid upload metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public app asset
      parameters:
        - { name: filePath, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Object content. }
        "404": { description: File not found. }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve a private uploaded object to its owner
      parameters:
        - { name: objectPath, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Object content. }
        "401": { description: Authentication required. }
        "403": { description: Not the object owner. }
        "404": { description: File not found. }
  /datasets/complete:
    post:
      operationId: registerDataset
      tags: [Datasets]
      summary: Register and profile a completed object-storage upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetUploadInput" }
      responses:
        "201":
          description: Dataset profiled and stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400":
          description: Unsupported or invalid dataset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /datasets:
    get:
      operationId: listDatasets
      tags: [Datasets]
      summary: List the signed-in user's datasets
      responses:
        "200":
          description: User-owned datasets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetList" }
        "401":
          description: Authentication required.
  /datasets/{datasetId}:
    get:
      operationId: getDataset
      tags: [Datasets]
      summary: Get a user-owned dataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { description: Dataset not found. }
    delete:
      operationId: deleteDataset
      tags: [Datasets]
      summary: Delete a user-owned dataset and its stored file
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Dataset deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "404": { description: Dataset not found. }
  /datasets/{datasetId}/profile:
    get:
      operationId: getDatasetProfile
      tags: [Datasets]
      summary: Get computed column profiles and detected issues
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Computed profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
        "404": { description: Dataset not found. }
  /datasets/{datasetId}/statistics:
    get:
      operationId: getDatasetStatistics
      tags: [Datasets]
      summary: Compute descriptive statistics and correlations
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Computed statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatisticsResponse" }
        "404": { description: Dataset not found. }
  /datasets/{datasetId}/eda:
    post:
      operationId: createDatasetVisualization
      tags: [Datasets]
      summary: Generate a visualization from real dataset columns
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdaRequest" }
      responses:
        "200":
          description: Computed chart data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdaResponse" }
        "400":
          description: Invalid columns or chart type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { description: Dataset not found. }
  /datasets/{datasetId}/clean:
    post:
      operationId: cleanDataset
      tags: [Datasets]
      summary: Create a cleaned derivative without changing the original
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleaningRequest" }
      responses:
        "201":
          description: Cleaned dataset derivative.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400":
          description: Invalid cleaning operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /ml/train:
    post:
      operationId: trainModel
      tags: [Models]
      summary: Train and evaluate a model on a user-owned dataset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainRequest" }
      responses:
        "201":
          description: Experiment with computed metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "400":
          description: Invalid target or insufficient data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { description: Dataset not found. }
  /experiments:
    get:
      operationId: listExperiments
      tags: [Models]
      summary: List saved model experiments
      responses:
        "200":
          description: Saved experiment runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentList" }
  /experiments/{experimentId}:
    get:
      operationId: getExperiment
      tags: [Models]
      summary: Get a saved experiment
      parameters:
        - name: experimentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Experiment details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Experiment" }
        "404": { description: Experiment not found. }
  /reports:
    get:
      operationId: listReports
      tags: [Reports]
      summary: List generated reports
      responses:
        "200":
          description: Saved reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
  /reports/generate:
    post:
      operationId: generateReport
      tags: [Reports]
      summary: Generate and save a report from computed dataset results
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "201":
          description: Saved report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { description: Dataset not found. }
  /reports/{reportId}:
    get:
      operationId: getReport
      tags: [Reports]
      summary: Get a saved report
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Report details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { description: Report not found. }
  /reports/{reportId}/download:
    get:
      operationId: downloadReport
      tags: [Reports]
      summary: Download a saved report as HTML
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Self-contained HTML report.
          content:
            text/html:
              schema: { type: string }
        "404": { description: Report not found. }
  /ai-analyst/chat:
    post:
      operationId: chatWithAnalyst
      tags: [Analyst]
      summary: Answer a dataset question using validated analysis tools
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnalystChatRequest" }
      responses:
        "200":
          description: Answer grounded in tool results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalystChatResponse" }
        "404": { description: Dataset not found. }
        "502": { description: AI provider request failed. }
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema: { type: string }
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema: { type: string }
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ErrorEnvelope:
      type: object
      properties:
        error: { type: string }
      required: [error]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: ["string", "null"], format: email }
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }
        profileImageUrl: { type: ["string", "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 104857600 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }
    DatasetUploadInput:
      type: object
      required: [name, size, contentType, objectPath]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 104857600 }
        contentType: { type: string }
        objectPath: { type: string, minLength: 1 }
    Dataset:
      type: object
      required: [id, name, fileType, fileSize, rows, columns, qualityScore, targetCandidates, profile, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        fileType: { type: string }
        fileSize: { type: integer }
        rows: { type: integer }
        columns: { type: integer }
        qualityScore: { type: number }
        targetCandidates:
          type: array
          items: { type: string }
        profile:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    DatasetList:
      type: object
      required: [datasets]
      properties:
        datasets:
          type: array
          items: { $ref: "#/components/schemas/Dataset" }
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    ProfileResponse:
      type: object
      additionalProperties: true
    StatisticsResponse:
      type: object
      additionalProperties: true
    EdaRequest:
      type: object
      required: [chartType]
      properties:
        xColumn: { type: string }
        yColumn: { type: string }
        chartType: { type: string, enum: [histogram, bar, scatter, box, correlation] }
        aggregation: { type: string, enum: [mean, median, count, sum] }
    EdaResponse:
      type: object
      additionalProperties: true
    CleaningRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [remove_duplicates, drop_column, fill_missing, rename_column, convert_type] }
              column: { type: string }
              value: { type: string }
              newName: { type: string }
              targetType: { type: string, enum: [number, string, date] }
    TrainRequest:
      type: object
      required: [datasetId, targetColumn, features, model, problemType]
      properties:
        datasetId: { type: string, format: uuid }
        targetColumn: { type: string, minLength: 1 }
        features:
          type: array
          minItems: 1
          items: { type: string }
        model: { type: string }
        problemType: { type: string, enum: [auto, classification, regression] }
        testSize: { type: number, minimum: 0.1, maximum: 0.5, default: 0.2 }
        randomSeed: { type: integer, minimum: 0, maximum: 2147483647, default: 42 }
    Experiment:
      type: object
      required: [id, datasetId, datasetName, name, problemType, targetColumn, features, model, metrics, featureImportance, durationSeconds, createdAt]
      properties:
        id: { type: string, format: uuid }
        datasetId: { type: string, format: uuid }
        datasetName: { type: string }
        name: { type: string }
        problemType: { type: string }
        targetColumn: { type: string }
        features: { type: array, items: { type: string } }
        model: { type: string }
        metrics: { type: object, additionalProperties: true }
        featureImportance:
          type: array
          items:
            type: object
            required: [feature, importance]
            properties:
              feature: { type: string }
              importance: { type: number }
        confusionMatrix:
          type: ["array", "null"]
          items: { type: array, items: { type: integer } }
        durationSeconds: { type: number }
        createdAt: { type: string, format: date-time }
    ExperimentList:
      type: object
      required: [experiments]
      properties:
        experiments: { type: array, items: { $ref: "#/components/schemas/Experiment" } }
    ReportRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: string, format: uuid }
        experimentId: { type: string, format: uuid }
    Report:
      type: object
      required: [id, datasetId, title, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        datasetId: { type: string, format: uuid }
        title: { type: string }
        content: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ReportList:
      type: object
      required: [reports]
      properties:
        reports: { type: array, items: { $ref: "#/components/schemas/Report" } }
    AnalystChatRequest:
      type: object
      required: [datasetId, message]
      properties:
        datasetId: { type: string, format: uuid }
        message: { type: string, minLength: 1, maxLength: 4000 }
    AnalystChatResponse:
      type: object
      required: [answer, toolResults]
      properties:
        answer: { type: string }
        toolResults:
          type: array
          items: { type: object, additionalProperties: true }

