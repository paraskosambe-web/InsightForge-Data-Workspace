kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
[[services]]
name = "Python Compute"
paths = ["/compute"]
localPort = 8008

[services.development]
run = "if [ -f pyproject.toml ]; then ROOT=.; APP_DIR=artifacts/api-server/python; else ROOT=../..; APP_DIR=python; fi; uv run --frozen --no-dev --project \"$ROOT\" python -m uvicorn insightforge_service.main:app --app-dir \"$APP_DIR\" --host 0.0.0.0 --port \"${PORT:-8008}\""

[services.production]

[services.production.build]
args = ["bash", "-lc", "if [ -f pyproject.toml ]; then uv sync --frozen --no-dev --no-install-project --project .; else uv sync --frozen --no-dev --no-install-project --project ../..; fi"]

[services.production.run]
args = ["bash", "-lc", "if [ -f pyproject.toml ]; then ROOT=.; APP_DIR=artifacts/api-server/python; else ROOT=../..; APP_DIR=python; fi; uv run --no-sync --project \"$ROOT\" python -m uvicorn insightforge_service.main:app --app-dir \"$APP_DIR\" --host 0.0.0.0 --port \"${PORT:-8008}\""]

[services.production.run.env]
PORT = "8008"

[services.production.health.startup]
path = "/healthz"
