kind = "web"
previewPath = "/"
title = "InsightForge"
description = "A private, full-stack data science workspace for profiling datasets, training models, exploring insights, and saving reports."
version = "1.0.0"
id = "artifacts/insightforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25306

[services.development]
run = "pnpm --filter @workspace/insightforge run dev"

[services.production]
serve = "static"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/insightforge", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "25306"
BASE_PATH = "/"
publicDir = "artifacts/insightforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25306"
BASE_PATH = "/"
